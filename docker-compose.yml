services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quantdesk
      POSTGRES_PASSWORD: quantdesk
      POSTGRES_DB: quantdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantdesk -d quantdesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://quantdesk:quantdesk@postgres:5432/quantdesk
      LOCAL_DATA_DIRECTORY: /data/datasets
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./datasets:/data/datasets
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    # context is the repo root because the web app imports the shared API contract
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
